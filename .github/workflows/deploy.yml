name: Deploy to Render

# Production moved to Northflank (which deploys via its own GitHub
# integration, not this workflow). Render is kept only as a fallback during
# the transition, so this no longer triggers automatically on every push --
# run it manually (Actions tab -> Deploy to Render -> Run workflow) if Render
# needs to be redeployed.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to Render
      uses: johnbeynon/render-deploy-action@v0.0.8
      with:
        service-id: ${{ secrets.RENDER_SERVICE_ID }}
        api-key: ${{ secrets.RENDER_API_KEY }}
        wait-for-success: true
