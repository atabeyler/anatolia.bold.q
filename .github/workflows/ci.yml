name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  # Cheap, fast fail-fast check: package.json/client/package.json/
  # server/package.json must always agree on version (scripts/bump-version.js
  # keeps them in sync on every commit -- this is the guard against a
  # hand-edit or merge conflict silently breaking that). desktop-release.yml
  # and android-release.yml both run the same check again right before
  # building, since a release can be triggered by a tag push that skips CI.
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-version-consistency.js

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Validate quantum script syntax
        run: python3 -m py_compile quantum/scenario_quantum.py quantum/fraud_detection.py quantum/portfolio_optimizer.py quantum/_ibm_backend.py

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Desktop's own tests don't need a display or Electron itself -- they're
  # pure Node/vitest against better-sqlite3 built for the runner's own Node
  # ABI (never electron-rebuild'd here, so no ABI mismatch), unlike an
  # actual Electron launch which desktop-release.yml covers on Windows.
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx vitest run desktop
