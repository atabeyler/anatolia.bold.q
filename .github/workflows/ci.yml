name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Kuantum betiklerinin sözdizimini doğrula
        run: python3 -m py_compile quantum/scenario_quantum.py quantum/fraud_detection.py quantum/portfolio_optimizer.py quantum/_ibm_backend.py

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Desktop's own tests don't need a display or Electron itself -- they're
  # pure Node/vitest against better-sqlite3 built for the runner's own Node
  # ABI (never electron-rebuild'd here, so no ABI mismatch), unlike an
  # actual Electron launch which desktop-release.yml covers on Windows.
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx vitest run desktop
