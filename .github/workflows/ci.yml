name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-version-consistency.js

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install server dependencies
        run: npm ci
      - name: Install root dependencies (for desktop/testHelpers.js, used by sync.e2e.test.js)
        working-directory: .
        run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Validate quantum script syntax
        run: python3 -m py_compile quantum/scenario_quantum.py quantum/fraud_detection.py quantum/portfolio_optimizer.py quantum/_ibm_backend.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/quantum/requirements.txt
      - name: Install quantum dependencies
        run: pip install -r quantum/requirements.txt
      - name: Quantum worker smoke test
        run: python3 quantum/smoke_test.py

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx vitest run desktop

  elliptic-benchmark:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/experiment/constrained-adaptive-threshold' || github.ref == 'refs/heads/experiment/elliptic-graph-features')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download official Elliptic transaction data
        working-directory: server
        run: |
          set -euo pipefail
          mkdir -p data/elliptic
          base='https://data.pyg.org/datasets/elliptic'
          for f in elliptic_txs_features.csv elliptic_txs_classes.csv elliptic_txs_edgelist.csv; do
            curl --fail --location --retry 3 --retry-delay 5 "$base/$f.zip" -o "/tmp/$f.zip"
            unzip -o "/tmp/$f.zip" -d data/elliptic
          done
      - name: Run blind temporal benchmark
        working-directory: server
        run: node scripts/run-elliptic-benchmark.js data/elliptic | tee elliptic-benchmark-results.json
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: elliptic-aml-benchmark-results
          path: server/elliptic-benchmark-results.json
          if-no-files-found: error
          retention-days: 30
