name: Desktop Release

# Builds the Windows installer on an actual Windows runner (electron-builder's
# NSIS target needs wine on Linux even for an unsigned build -- see
# desktop/README.md) and publishes it to GitHub Releases via electron-updater's
# configured publish target (package.json's build.publish). No custom secret
# is needed: GITHUB_TOKEN is provided automatically by Actions and is scoped
# to this repository, which is all the GitHub-provider publisher needs.
#
# Fires automatically on a push to main that actually touches desktop code
# (path-filtered so an unrelated server/client-only commit doesn't spend a
# ~10-minute Windows runner for nothing), on a `desktop-v*` tag, or on a
# manual "Run workflow" click.
on:
  push:
    tags:
      - 'desktop-v*'
    branches:
      - main
    paths:
      - 'desktop/**'
      - 'client/src/services/desktopBridge.js'
      - 'client/src/components/Desktop*.jsx'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop-release.yml'
  workflow_dispatch:
    inputs:
      allow_unsigned:
        description: 'Publish an unsigned installer anyway (only for a deliberate test build -- never for an official version)'
        type: boolean
        default: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Verify version consistency across package.json files
        run: node scripts/check-version-consistency.js

      # electron-builder signs automatically once CSC_LINK/CSC_KEY_PASSWORD
      # are set as repo secrets and silently builds unsigned when they're
      # not -- fine for a local `npm run dist:win` dev build, but this is
      # the path that publishes an "official" GitHub Release, so an
      # accidental unsigned publish here is exactly what installs
      # SmartScreen-flagged onto every user's machine. Every automatic
      # trigger (push) requires signing; only a deliberate manual
      # workflow_dispatch with allow_unsigned=true can skip it.
      - name: Require code signing for automatic/official releases
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.allow_unsigned != 'true'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ] || [ -z "$CSC_KEY_PASSWORD" ]; then
            echo "::error::CSC_LINK/CSC_KEY_PASSWORD are not set -- refusing to publish an unsigned Windows installer as an official release."
            echo "See desktop/README.md's 'Code signing' section to generate and register a certificate,"
            echo "or re-run this workflow manually via workflow_dispatch with allow_unsigned=true for a deliberate unsigned test build."
            exit 1
          fi

      - name: Build and publish the Windows installer
        run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
