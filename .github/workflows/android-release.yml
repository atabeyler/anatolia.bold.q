name: Android Release

# Builds the sideload APK (client/dist bundled into the Capacitor Android
# project) and publishes it as a GitHub Release asset -- never to Google
# Play, per this app's closed institutional distribution requirement (see
# mobile/README.md). Signing is opt-in, same pattern as
# desktop-release.yml's CSC_LINK/CSC_KEY_PASSWORD: once the four
# ANDROID_KEYSTORE_* secrets below are set (Settings -> Secrets and
# variables -> Actions), the release APK is signed with the project's
# self-signed keystore; unset, the build still runs and produces an
# unsigned APK for manual signing later.
#
# Fires on a push to main that touches mobile/client code, on an
# `android-v*` tag, or on a manual "Run workflow" click.
on:
  push:
    tags:
      - 'android-v*'
    branches:
      - main
    paths:
      - 'mobile/**'
      - 'client/src/mobile/**'
      - 'client/src/services/mobileBridge.js'
      - 'client/src/services/nativeBridge.js'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build the web bundle
        working-directory: client
        run: npm run build

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Sync web bundle into the Android project
        working-directory: mobile
        run: npx cap sync android

      - name: Restore signing keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: mobile/android
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > anatolia-q-release.jks
          cat > keystore.properties <<EOF
          storeFile=anatolia-q-release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
