services:
  - type: web
    name: anatolia-q
    runtime: node
    plan: free
    # --ignore-installed on the pip step: some base images ship a system
    # PyJWT (via apt/dist-packages) that pip can't uninstall (no RECORD
    # metadata, "installed by debian"), which aborts the whole install
    # before qiskit gets to install -- silently leaving quantum mode
    # broken (falls back to AI-only estimates with no visible error).
    # --ignore-installed sidesteps the uninstall attempt entirely.
    buildCommand: "rm -rf client/dist client/node_modules/.vite && npm install --prefix server && npm install --prefix client && npm run build --prefix client && pip3 install --ignore-installed -r server/quantum/requirements.txt"
    startCommand: "npm run start --prefix server"
    # autoDeployTrigger defaults to "commit", so *every* push to main deploys
    # -- but the build command above only ever touches client/, server/, and
    # server/quantum/; it never reads desktop/, mobile/, .github/, or the
    # root markdown/spec docs. A push that only touches those paths would
    # still trigger a full (client build + npm installs + qiskit's pip
    # install) rebuild for a server binary that comes out byte-for-byte
    # identical -- purely wasted free-tier build-minute quota. See the
    # sibling anatolia.bold.sim project's render.yaml, which hit this same
    # problem from a run of doc-only commits and fixed it the same way.
    # ignoredPaths skips the rebuild for those; changes to render.yaml
    # itself are always processed regardless (Render's own behavior, not
    # something this filter controls).
    buildFilter:
      ignoredPaths:
        - "*.md"
        - "*.yaml"
        - "desktop/**"
        - "mobile/**"
        - ".github/**"
    envVars:
      - key: NODE_ENV
        value: production
      # Pins the Python build toolchain Render provisions. Without this,
      # Render's default Python (currently 3.14) has no prebuilt wheel for
      # qiskit's symengine dependency, so pip falls back to compiling it
      # from source -- which then fails because the SymEngine C++ library
      # itself isn't installed. 3.11 has long had working symengine wheels
      # (it's what both the original Render setup and the later Fly.io
      # Docker image, via Debian bookworm's system python3, used).
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Reuses the existing "anatolia-dbs" Postgres instance (Render's free
      # plan allows only one active free database per account) instead of
      # provisioning a new one here — set this to its Internal Database URL
      # from the Render dashboard.
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CENTER_EMAIL
        value: info@boldkimya.com.tr
      - key: SHARED_PASSWORD
        sync: false
      - key: APP_URL
        sync: false
      # The following are optional -- if left unset, the app automatically
      # falls back to in-memory/local-disk behavior, nothing breaks.
      - key: REDIS_URL
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: IBM_QUANTUM_TOKEN
        sync: false
      - key: IBM_QUANTUM_INSTANCE
        sync: false
      - key: IBM_QUANTUM_WAIT_SECONDS
        value: "60"
      # Web push notifications -- optional, generate with
      # `npx web-push generate-vapid-keys`. Undefined means push stays
      # disabled (isPushConfigured() returns false), no error is raised.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # How long conversation memory entries are retained before pruning;
      # optional, defaults applied in code if unset.
      - key: CONVERSATION_MEMORY_TTL_DAYS
        sync: false
      # Comma-separated RSS feed URLs for the morning brief news section;
      # optional, defaults applied in code if unset.
      - key: NEWS_RSS_SOURCES
        sync: false
