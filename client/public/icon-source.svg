<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGlow" cx="68%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#16243a"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </radialGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bgGlow)"/>

  <!-- Two plain concentric guide rings -->
  <circle cx="256" cy="256" r="175" fill="none" stroke="#5b7fa6" stroke-width="2" opacity="0.35"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#5b7fa6" stroke-width="1.5" opacity="0.3"/>

  <!-- Three dashed orbit rings, tilted like an atom model -->
  <ellipse cx="256" cy="256" rx="222" ry="96" fill="none" stroke="#d4af37" stroke-width="4" stroke-dasharray="14 10" opacity="0.9" transform="rotate(18 256 256)"/>
  <ellipse cx="256" cy="256" rx="222" ry="96" fill="none" stroke="#c23b5e" stroke-width="4" stroke-dasharray="14 10" opacity="0.85" transform="rotate(-58 256 256)"/>
  <ellipse cx="256" cy="256" rx="222" ry="96" fill="none" stroke="#3f7fd1" stroke-width="4" stroke-dasharray="14 10" opacity="0.85" transform="rotate(72 256 256)"/>

  <!-- Central "Q" mark: a bold ring with a flicked tail, plus the orbiting dot -->
  <g filter="url(#softGlow)">
    <circle cx="256" cy="256" r="96" fill="none" stroke="#d9b04a" stroke-width="18"/>
    <path d="M 320 322 C 352 344 376 342 398 322"
          fill="none" stroke="#d9b04a" stroke-width="15" stroke-linecap="round"/>
  </g>
  <circle cx="250" cy="308" r="13" fill="#4fd6e8"/>

</svg>
